<!doctype html>
<html lang="vi" class="h-full bg-slate-50">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký - EduCRM & Sales</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "sans-serif"],
            },
          },
        },
      };
    </script>

    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="min-h-full flex flex-col justify-center py-12 sm:px-6 lg:px-8 font-sans antialiased text-slate-800">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
      <div class="flex items-center justify-center gap-3">
        <div
          class="w-12 h-12 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white font-bold text-2xl shadow-lg shadow-indigo-500/30"
        >
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <div>
          <h1 class="font-bold text-slate-900 text-2xl leading-tight">EduCRM</h1>
        </div>
      </div>
      <h2 class="mt-6 text-center text-2xl font-bold tracking-tight text-slate-900">Tạo tài khoản nhân viên mới</h2>
      <p class="mt-2 text-center text-sm text-slate-600">
        Hoặc
        <a href="login.html" class="font-medium text-indigo-600 hover:text-indigo-500">đăng nhập nếu đã có tài khoản</a>
      </p>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-xl">
      <div class="bg-white py-8 px-4 shadow-sm sm:rounded-2xl border border-slate-200 sm:px-10">
        <form class="space-y-5" action="login.html" method="GET">
          <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">
            <!-- Họ và Tên -->
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-1" for="fullname">Họ và Tên</label>
              <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                  <i class="fa-regular fa-user text-slate-400"></i>
                </div>
                <input
                  id="fullname"
                  name="fullname"
                  type="text"
                  required
                  class="block w-full pl-10 pr-3 py-2.5 border border-slate-200 rounded-xl text-sm placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"
                  placeholder="Nguyễn Văn A"
                />
              </div>
            </div>

            <!-- Số điện thoại -->
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-1" for="phone">Số điện thoại</label>
              <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                  <i class="fa-solid fa-phone text-slate-400"></i>
                </div>
                <input
                  id="phone"
                  name="phone"
                  type="tel"
                  required
                  class="block w-full pl-10 pr-3 py-2.5 border border-slate-200 rounded-xl text-sm placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"
                  placeholder="0987654321"
                />
              </div>
            </div>
          </div>

          <!-- Email -->
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1" for="email">Email</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <i class="fa-regular fa-envelope text-slate-400"></i>
              </div>
              <input
                id="email"
                name="email"
                type="email"
                required
                class="block w-full pl-10 pr-3 py-2.5 border border-slate-200 rounded-xl text-sm placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"
                placeholder="email@domain.com"
              />
            </div>
          </div>

          <!-- Chức vụ -->
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1" for="role">Bộ phận / Chức vụ</label>
            <div class="relative">
              <select
                id="role"
                name="role"
                class="block w-full px-3 py-2.5 border border-slate-200 bg-white rounded-xl text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"
              >
                <option value="sales">Sales Consultant (Tư vấn viên)</option>
                <option value="trainer">Giảng Viên (Trainer)</option>
                <option value="admin">Admin / Nhân sự</option>
                <option value="manager">Quản lý trung tâm</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">
            <!-- Mật khẩu -->
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-1" for="password">Mật khẩu</label>
              <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                  <i class="fa-solid fa-lock text-slate-400"></i>
                </div>
                <input
                  id="password"
                  name="password"
                  type="password"
                  required
                  class="block w-full pl-10 pr-3 py-2.5 border border-slate-200 rounded-xl text-sm placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"
                  placeholder="••••••••"
                />
              </div>
            </div>

            <!-- Xác nhận mật khẩu -->
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-1" for="confirm-password"
                >Xác nhận mật khẩu</label
              >
              <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                  <i class="fa-solid fa-shield-halved text-slate-400"></i>
                </div>
                <input
                  id="confirm-password"
                  name="confirm-password"
                  type="password"
                  required
                  class="block w-full pl-10 pr-3 py-2.5 border border-slate-200 rounded-xl text-sm placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"
                  placeholder="••••••••"
                />
              </div>
            </div>
          </div>

          <div class="flex items-center">
            <input
              id="terms"
              name="terms"
              type="checkbox"
              required
              class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-slate-300 rounded cursor-pointer"
            />
            <label for="terms" class="ml-2 block text-sm text-slate-600">
              Tôi đồng ý với <a href="#" class="text-indigo-600 hover:underline">Điều khoản</a> và
              <a href="#" class="text-indigo-600 hover:underline">Chính sách bảo mật</a>
            </label>
          </div>

          <div>
            <button
              type="submit"
              class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-xl shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors"
            >
              Đăng ký tài khoản
            </button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
